name: 뉴스·증시 데이터 업데이트
on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다
  workflow_dispatch:          # 수동 실행 버튼
permissions:
  contents: write   # data 브랜치에 결과 올리기
  actions: write    # 예약 실행이 꺼지지 않게 유지
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 이전 캐시 가져오기 (번역·요약 재사용)
        run: |
          mkdir -p out
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/data/cache.json" -o out/cache.json || echo '{}' > out/cache.json
      - name: 뉴스·증시 데이터 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # (선택) 넣으면 AI 요약이 켜져요
        run: python3 build.py out
      - name: data 브랜치에 올리기 (기록이 쌓이지 않게 1개 커밋으로 덮어쓰기)
        run: |
          cd out
          git init -q -b data
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: 예약 실행 유지 (60일 비활성 자동 중지 방지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
